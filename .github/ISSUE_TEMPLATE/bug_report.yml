name: Bug 报告
description: 提交问题反馈以帮助我们改进
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清晰描述你遇到的问题
      placeholder: 期望的行为是什么？实际发生了什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 如何触发这个问题
      placeholder: |
        1. 打开页面...
        2. 点击...
        3. 观察到...
  - type: input
    id: browser
    attributes:
      label: 浏览器及版本
      placeholder: 如 Chrome 125、Edge 125
  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: 如 Windows 11、macOS 15
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 截图、控制台错误信息等
