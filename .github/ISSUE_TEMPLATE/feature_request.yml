name: 功能建议
description: 提出新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 这个功能解决什么痛点？描述使用场景
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你期望的解决方案
      description: 描述你期望的行为或交互
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 是否有其他方式可以达到相同目的
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 参考链接、截图、其他项目的实现等
